# Generated by `queueway init` — safe to commit and to edit.
# Runs Queueway's own services; nothing else on this machine is touched.
#
#   docker compose -f docker-compose.queueway.yml up -d      start
#   docker compose -f docker-compose.queueway.yml ps         status
#   docker compose -f docker-compose.queueway.yml down       stop (data kept)
#   docker compose -f docker-compose.queueway.yml down -v    stop and delete all job data

name: queueway-queueway_monorepo

services:
  redis:
    image: redis:7-alpine
    container_name: queueway-queueway_monorepo-redis
    restart: unless-stopped
    # appendonly keeps queued jobs on disk, so a Redis restart doesn't drop them.
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: queueway-queueway_monorepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueway_queueway_monorepo
      POSTGRES_USER: queueway_queueway_monorepo
      POSTGRES_PASSWORD: SFrZGokI72CyXEEyij_RCbG_
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueway_queueway_monorepo -d queueway_queueway_monorepo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redisdata:
  pgdata:
